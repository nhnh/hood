<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory Tree - nhnh/hood</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #24292e;
      background-color: #f6f8fa;
    }
    .container {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #d0d7de;
    }
    ul {
      list-style-type: none;
      padding-left: 20px;
      margin: 6px 0;
    }
    ul.root-tree {
      padding-left: 0;
    }
    li {
      margin: 6px 0;
      line-height: 1.5;
    }
    .folder-toggle {
      cursor: pointer;
      font-weight: 600;
      color: #24292e;
      user-select: none;
    }
    .folder-toggle:hover {
      color: #0969da;
    }
    a.file-link {
      text-decoration: none;
      color: #0969da;
    }
    a.file-link:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
    .loading {
      color: #57606a;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📂 Directory Tree</h1>
  <div id="tree-container" class="loading">Memuatkan senarai fail...</div>
</div>

<script>
  const USERNAME = "nhnh";
  const REPO     = "hood";
  const BRANCH   = "main";
  const TARGET_FOLDER = ""; // Biarkan kosong untuk papar semua, atau tukar ke "Main" jika mahu isi dalam folder Main sahaja

  async function fetchRepoTree() {
    const container = document.getElementById("tree-container");
    const apiUrl = `https://github.com{USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    try {
      const response = await fetch(apiUrl, {
        headers: {
          "Accept": "application/vnd.github.v3+json"
        }
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(`HTTP ${response.status}: ${errorData.message || response.statusText}`);
      }
      
      const data = await response.json();
      const treeData = buildHierarchy(data.tree);
      
      container.classList.remove("loading");
      container.innerHTML = "";
      container.appendChild(renderTree(treeData, true));
    } catch (error) {
      container.classList.remove("loading");
      container.innerHTML = `
        <div style="color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; border: 1px solid rgba(255,129,130,0.4);">
          <strong>Ralat Sambungan:</strong> ${error.message}<br><br>
          <small>Pastikan anda membuka halaman ini melalui pautan rasmi <strong>https://github.io</strong> dan sambungan ke <em>api.github.com</em> tidak disekat oleh rangkaian atau pelayar anda.</small>
        </div>`;
    }
  }

  function buildHierarchy(items) {
    const root = {};

    items.forEach(item => {
      if (item.path === "index.html" || item.path.startsWith(".")) return;
      if (TARGET_FOLDER && !item.path.startsWith(TARGET_FOLDER + "/")) return;

      const cleanPath = TARGET_FOLDER ? item.path.replace(TARGET_FOLDER + "/", "") : item.path;
      const parts = cleanPath.split("/");
      let current = root;

      parts.forEach((part, index) => {
        if (!current[part]) {
          current[part] = {
            __type: (index === parts.length - 1 && item.type === "blob") ? "file" : "folder",
            __path: item.path,
            __children: {}
          };
        }
        current = current[part].__children;
      });
    });

    return root;
  }

  function renderTree(node, isRoot = false) {
    const ul = document.createElement("ul");
    if (isRoot) ul.classList.add("root-tree");

    const keys = Object.keys(node).sort((a, b) => {
      const typeA = node[a].__type;
      const typeB = node[b].__type;
      if (typeA !== typeB) return typeA === "folder" ? -1 : 1;
      return a.localeCompare(b);
    });

    keys.forEach(key => {
      const item = node[key];
      const li = document.createElement("li");

      if (item.__type === "folder") {
        const span = document.createElement("span");
        span.className = "folder-toggle";
        span.textContent = `📂 ${key}`;
        
        const childUl = renderTree(item.__children);
        
        span.onclick = () => {
          childUl.classList.toggle("hidden");
          span.textContent = childUl.classList.contains("hidden") ? `📁 ${key}` : `📂 ${key}`;
        };

        li.appendChild(span);
        li.appendChild(childUl);
      } else {
        const a = document.createElement("a");
        a.className = "file-link";
        a.href = encodeURI(item.__path);
        a.textContent = `📄 ${key}`;
        a.target = "_blank";
        li.appendChild(a);
      }

      ul.appendChild(li);
    });

    return ul;
  }

  fetchRepoTree();
</script>

</body>
</html>
