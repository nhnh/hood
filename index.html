<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoOD : House of Official Documents</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #24292e;
      background-color: #f6f8fa;
    }
    .container {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #d0d7de;
    }
    ul {
      list-style-type: none;
      padding-left: 20px;
      margin: 6px 0;
    }
    ul.root-tree {
      padding-left: 0;
    }
    li {
      margin: 6px 0;
      line-height: 1.5;
    }
    .folder-toggle {
      cursor: pointer;
      font-weight: 600;
      color: #24292e;
      user-select: none;
    }
    .folder-toggle:hover {
      color: #0969da;
    }
    a.file-link {
      text-decoration: none;
      color: #0969da;
    }
    a.file-link:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
    .loading {
      color: #57606a;
      font-style: italic;
    }
    .summary {
      color: #57606a;
      font-size: 13px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📂 Directory Tree: Main</h1>
  <div id="tree-summary" class="summary"></div>
  <div id="tree-container" class="loading">Memuatkan senarai fail...</div>
</div>

<script>
  // === TETAPAN ===
  const USERNAME      = "nhnh";
  const REPO          = "hood";       // Nama repository sahaja, bukan URL penuh
  const BRANCH        = "main";
  const TARGET_FOLDER = "Main";       // Senaraikan kandungan folder ini sahaja
  // ================

  function encodePath(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }

  function fileUrl(path) {
    return `https://github.com/${USERNAME}/${REPO}/blob/${BRANCH}/${encodePath(path)}`;
  }

  async function fetchRepoTree() {
    const container = document.getElementById("tree-container");
    const summary = document.getElementById("tree-summary");
    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    try {
      const response = await fetch(apiUrl);
      if (response.status === 403) {
        throw new Error("Had kadar GitHub API tercapai. Sila cuba sebentar lagi.");
      }
      if (!response.ok) {
        throw new Error(`Gagal mendapatkan data GitHub API (HTTP ${response.status}).`);
      }

      const data = await response.json();
      if (!Array.isArray(data.tree)) throw new Error("Format data GitHub API tidak dijangka.");

      const { tree, fileCount, folderCount } = buildHierarchy(data.tree);

      container.classList.remove("loading");
      container.innerHTML = "";
      summary.textContent = `${fileCount} fail, ${folderCount} subfolder dalam "${TARGET_FOLDER}"`;

      if (Object.keys(tree).length === 0) {
        container.textContent = `Tiada fail atau subfolder ditemui dalam "${TARGET_FOLDER}".`;
        return;
      }

      container.appendChild(renderTree(tree, true));
    } catch (error) {
      container.classList.remove("loading");
      summary.textContent = "";
      container.innerHTML = `<p style="color: red;">Ralat: ${error.message}</p>`;
    }
  }

  // Tukar senarai path GitHub kepada struktur folder/file bersarang.
  function buildHierarchy(items) {
    const root = {};
    let fileCount = 0;
    const folderPaths = new Set();

    items.forEach(item => {
      // Abaikan index.html, fail tersembunyi, dan path di luar TARGET_FOLDER.
      if (item.path === "index.html" || item.path.startsWith(".")) return;
      if (item.path === TARGET_FOLDER) return;
      if (TARGET_FOLDER && !item.path.startsWith(TARGET_FOLDER + "/")) return;

      const cleanPath = TARGET_FOLDER
        ? item.path.slice(TARGET_FOLDER.length + 1)
        : item.path;
      if (!cleanPath) return;

      const parts = cleanPath.split("/");
      let current = root;
      let currentPath = TARGET_FOLDER;

      parts.forEach((part, index) => {
        currentPath += "/" + part;
        const isLast = index === parts.length - 1;
        const isFile = isLast && item.type === "blob";

        if (!current[part] || (!isLast && current[part].__type === "file")) {
          current[part] = {
            __type: isFile ? "file" : "folder",
            __path: isFile ? item.path : currentPath,
            __children: {}
          };
        }

        if (!isFile) folderPaths.add(currentPath);
        if (isFile) fileCount++;

        current = current[part].__children;
      });
    });

    return { tree: root, fileCount, folderCount: folderPaths.size };
  }

  // Bina elemen <ul>/<li> secara rekursif supaya semua subfolder dipaparkan.
  function renderTree(node, isRoot = false) {
    const ul = document.createElement("ul");
    if (isRoot) ul.classList.add("root-tree");

    const keys = Object.keys(node).sort((a, b) => {
      const typeA = node[a].__type;
      const typeB = node[b].__type;
      if (typeA !== typeB) return typeA === "folder" ? -1 : 1;
      return a.localeCompare(b, undefined, { sensitivity: "base" });
    });

    keys.forEach(key => {
      const item = node[key];
      const li = document.createElement("li");

      if (item.__type === "folder") {
        const span = document.createElement("span");
        span.className = "folder-toggle";
        span.textContent = `📂 ${key}`;
        span.setAttribute("aria-expanded", "true");

        const childUl = renderTree(item.__children);

        span.onclick = () => {
          const hidden = childUl.classList.toggle("hidden");
          span.textContent = hidden ? `📁 ${key}` : `📂 ${key}`;
          span.setAttribute("aria-expanded", String(!hidden));
        };

        li.appendChild(span);
        li.appendChild(childUl);
      } else {
        const a = document.createElement("a");
        a.className = "file-link";
        a.href = fileUrl(item.__path);
        a.textContent = `📄 ${key}`;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        li.appendChild(a);
      }

      ul.appendChild(li);
    });

    return ul;
  }

  fetchRepoTree();
</script>

</body>
</html>
